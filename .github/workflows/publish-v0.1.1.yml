name: Publish authorized v0.1.1
on:
  push:
    branches: ['release/v0.1.1-publish']
    paths: ['.github/workflows/publish-v0.1.1.yml']
permissions:
  contents: write
  checks: read
concurrency: release-v0.1.1-publish
jobs:
  publish:
    if: github.repository == 'afrisoltech/afrisol-open-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable source and required upstream checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4
          test "$(gh api repos/afrisoltech/afrisol-open-source/git/ref/heads/main --jq .object.sha)" = bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4
          gh api 'repos/afrisoltech/afrisol-open-source/commits/bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4/check-runs?per_page=100' > /tmp/release-checks.json
          python - <<'PY'
          import json
          checks = json.load(open('/tmp/release-checks.json'))['check_runs']
          for name in ['test (3.10)', 'test (3.12)', 'public-boundary']:
              runs = [c for c in checks if c['name'] == name and c['app']['id'] == 15368 and c['head_sha'] == 'bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4']
              latest = max(runs, key=lambda c: c['id'])
              assert latest['status'] == 'completed' and latest['conclusion'] == 'success', name
          print('Exact release commit required checks verified')
          PY
          python -m pip install --no-deps -e .
          python -m unittest discover -s tests -v
          python scripts/public_boundary.py
          python -m compileall -q src tests
      - name: Publish immutable annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/afrisoltech/afrisol-open-source/git/ref/tags/v0.1.1 >/dev/null 2>&1; then
            echo 'Tag exists; refusing to overwrite.'
            exit 1
          fi
          tag_oid=$(gh api --method POST repos/afrisoltech/afrisol-open-source/git/tags -f tag=v0.1.1 -f message='Afrisol Open Source v0.1.1: tested shared-component contribution and assurance programme.' -f object=bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4 -f type=commit --jq .sha)
          gh api --method POST repos/afrisoltech/afrisol-open-source/git/refs -f ref=refs/tags/v0.1.1 -f sha="$tag_oid"
          gh release create v0.1.1 --repo afrisoltech/afrisol-open-source --verify-tag --target bd91aa8d606c755d11c5b26fe4e5790c53bfbfd4 --title 'v0.1.1 — reviewed shared-component contributions' --notes-file docs/releases/v0.1.1.md
